function enemyPhase(){B.en.forEach(e=>{if(e&&!B.over)eAct(e)});if(B.over)return;
if(B.gcdN>0)B.gcdN--;{const g=B.en[1];if(B.boss.b.id==='has'&&g&&B.round-g.r0>=12)gateOff(0)}
[...B.al,...B.en].forEach(u=>{if(u&&!u.dead)['down','guard'].forEach(k=>{if(u.s[k]&&--u.s[k].t<=0)delete u.s[k]})});begin()}
function eAct(e){if(e.dead||e.sr===B.round||e.gate||(e.b.id==='has'&&B.en[1]))return;
if(e.s.pois){hurt(e,F(e.hp*.05),'毒');if(e.dead||B.over)return;if(--e.s.pois<=0)delete e.s.pois}
if(e.s.para>0){if(--e.s.para<=0)delete e.s.para;lg(e.n+'は麻痺で動けない');return}
e.cnt++;const b=e.b,low=e.hp<=e.mhp*.3,w=low?1:0;
if(b.id==='yog'&&e.cnt%(low?3:5)==0){const v=Math.min(e.mhp-e.hp,F(e.mhp*(low?.03:.05)));e.hp+=v;lg(`時間の巻き戻し！${e.n}のHPが${v}回復`)}
if(b.id==='cth'&&e.cnt%3==0){e.aoeB=(e.aoeB||0)+.2;lg('クトゥルフの呼び声！全体攻撃の威力が増した');return}
if(b.id==='has'&&!(B.gcdN>0)&&!B.en[1]){{const gh=F(500*DF[G.diff].h/10);B.en[1]={n:'カルコサの門',hp:gh,mhp:gh,atk:0,s:{},cds:{},cnt:0,gate:1,r0:B.round,b:{sk:[]}}};e.inv=1;lg('カルコサの門が開いた！ハスターは門の向こうへ姿を隠した');return}
const hd=B.en.some(x=>x&&x.hound&&!x.dead),okk=k=>(k.k!=='sac'||hd)&&(k.k!=='ann'||B.round>3)&&(k.k!=='sum'||B.hcd===undefined||B.round-B.hcd>=10);let ls=b.sk.filter(k=>okk(k)&&!(e.cds[k.n]>0));if(!ls.length)ls=b.sk.filter(okk);
let r=R()*ls.reduce((a,k)=>a+k.w[w],0),k=ls[0];for(const x of ls){r-=x.w[w];if(r<0){k=x;break}}
for(const n in e.cds)if(e.cds[n]>0)e.cds[n]--;e.cds[k.n]=k.cd||0;
lg(`${e.n}の${k.n}！`);
if(k.k==='sum'){let n=0;[0,2].forEach(i=>{if(!B.en[i]||B.en[i].dead){B.en[i]={n:'黒き仔',hp:100,mhp:100,hound:1,atk:10,s:{},cds:{},cnt:0,sr:B.round,b:{sk:[S1('通常攻撃','s',1,[1,1])]}};n++}});lg(n?`黒き仔が${n}体現れた`:'しかし何も起こらなかった');return}
if(k.k==='sac'){const i=B.en.findIndex(x=>x&&x.hound&&!x.dead);B.en[i]=null;B.hcd=B.round;const v=Math.min(e.mhp-e.hp,800);e.hp+=v;lg(`黒き仔が1体消滅した。${e.n}のHPが${v}回復`);return}
if(k.k==='tor'||k.k==='pul'||k.k==='mem'||k.k==='ann'){const L=B.al.filter(a=>!a.dead),pk=l=>l[F(R()*l.length)],p=pk(L);
if(k.k==='tor'){p.s.para=2;lg(`→${p.n}は麻痺した！`);const o=L.filter(x=>x!==p);if(o.length){const d=pk(o);d.s.down={t:4,r:.5};lg(`→${d.n}の攻撃力が50%低下した`)}}
else if(k.k==='pul'){p.s.pulse=3;lg(`→${p.n}は精神汚染のダメージが2倍になった`)}
else if(k.k==='mem'){if(R()<.3){p.mp=0;lg(`→${p.n}のMPが0になった`)}else{L.forEach(a=>{a.mp=Math.max(0,a.mp-20)});lg('→味方全員のMPが20減少した')}}
else{L.forEach(a=>{a.mp=0});lg('→味方全員のMPが0になった')}return}
if(k.k==='pa2'||k.k==='mp30'||k.k==='chs'){const L=B.al.filter(a=>!a.dead);
if(k.k==='pa2'){const c=L.slice();for(let i=Math.min(2,c.length);i>0;i--){const p=c.splice(F(R()*c.length),1)[0];p.s.para=2;lg(`→${p.n}は麻痺した！`)}}
else if(k.k==='mp30'){const p=L[F(R()*L.length)],v=Math.min(p.mp,30);p.mp-=v;lg(`→${p.n}のMPが${v}減少した`)}
else{const v=Math.min(e.mhp-e.hp,F(e.mhp*.3));e.hp+=v;lg(`→${e.n}のHPが${v}回復した`);L.forEach(t=>hit(e,t,1));L.forEach(t=>{if(!t.dead){t.s.pois=5;t.s.pmx=.03;lg(`→${t.n}は毒になった`)}})}return}
const live=B.al.filter(a=>!a.dead),ts=k.k==='a'?live:[e.b.id==='tin'?chaseT():live[Math.floor(Math.random()*live.length)]];
ts.forEach(t=>{hit(e,t,k.m+(k.k==='a'?(e.aoeB||0):0));if(k.e&&!t.dead&&!B.over){if(k.e==='para'){t.s.para=2;lg(t.n+'は麻痺した！')}else{t.s.down={t:3,r:.25};lg(t.n+'の攻撃力が低下した')}}})}
// ---- player actions ----
const sideOf=k=>['e','down','pois','para'].includes(k.t)?'e':['hs','bua','bug'].includes(k.t)?'a':null;
function pickActor(i){const a=B.al[i];if(a.dead||a.skip||B.ph!=='sel')return;B.actor=a;B.ph='act';draw()}
function ph(p){B.ph=p;draw()}
function back(){B.p=null;B.ph=B.actor?'act':'sel';draw()}
function pAtk(){B.p={t:'atk',side:'e'};ph('tgt')}
function pSk(i){const k=B.actor.c.sk[i];if(B.actor.mp<k.mp)return;B.p={t:'sk',k,side:sideOf(k)};B.p.side?ph('tgt'):doAct()}
function pIt(id){if(!G.items[id])return;B.p={t:'it',id,side:id==='rev'?'d':'a'};ph('tgt')}
function tg(kind,i){if(B.ph!=='tgt')return;const t=kind==='e'?B.en[i]:B.al[i],s=B.p.side;
if(kind==='e'?(s!=='e'||t.dead||t.inv):(s==='e'||(s==='d')!==!!t.dead))return;doAct(t)}
function doAct(t){if(B.ph==='busy')return;const p=B.p,a=B.actor;B.ph='busy';B.p=null;const had=a.s.up,hpa=a.s.pa;
if(p.t==='atk'){lg(`${a.n}の通常攻撃！`);hit(a,t,1)}
else if(p.t==='sk'){const k=p.k;a.mp-=k.mp;lg(`${a.n}の${k.n}！`);skill(a,k,t)}
else{if(G.items[p.id]<1){B.ph='act';return}G.items[p.id]--;save();const n=IT.find(i=>i.id===p.id).n;lg(`${a.n}は${n}を${t.n}に使った`);
if(p.id==='hp')heal(t,50);else if(p.id==='mp'){t.mp=Math.min(t.mmp,t.mp+30);lg('→MPが回復')}
else if(p.id==='rev'){t.dead=false;t.hp=Math.ceil(t.mhp*.25);t.s={};lg(`→${t.n}が蘇生した`)}
else if(p.id==='atk'){if(!t.s.pa)t.s.pa={n:2};lg('→攻撃力が上昇(使用者の攻撃2回)')}else{if(!t.s.pg)t.s.pg={n:2};lg('→被ダメージを軽減(被攻撃2回)')}}
if(hpa&&a.s.pa===hpa&&(p.t==='atk'||(p.t==='sk'&&(p.k.t==='e'||p.k.t==='ea'||p.k.t==='ebs')))&&--hpa.n<=0)delete a.s.pa;
if(had&&a.s.up===had&&--had.n<=0)delete a.s.up;
B.al.forEach(x=>{if(!x.dead&&!(x===a&&p.t==='sk'))x.mp=Math.min(x.mmp,x.mp+10)});
B.ph='sel';B.actor=null;if(!B.over)enemyPhase();draw()}
function skill(a,k,t){const L=B.al.filter(x=>!x.dead),E=B.en.filter(x=>x&&!x.dead&&!x.inv);
switch(k.t){case'e':hit(a,t,k.m);break;case'ea':E.forEach(e=>hit(a,e,k.m));break;
case'hs':heal(t,50+5*(a.lv-1));break;case'ha':L.forEach(x=>heal(x,30+3*(a.lv-1)));break;
case'gA':L.forEach(x=>x.s.guard={t:2,r:.35});lg('→味方全体の被ダメージ35%軽減');break;
case'gS':a.s.guard={t:2,r:.5};lg('→被ダメージ50%軽減');break;
case'down':t.s.down={t:2,r:.3};lg(`→${t.n}の攻撃力が30%低下`);break;
case'pois':t.s.pois=3;lg(`→${t.n}は毒になった`);break;
case'para':t.s.para=2;lg(`→${t.n}は麻痺した`);break;
case'up':a.s.up={n:2};lg('→攻撃力が25%上昇');break;
case'ebs':E.forEach(x=>hit(a,x,k.m,1));break;
case'bua':{const p=t.s.pa;if(p)p.r=Math.max(p.r||.25,.5);else t.s.pa={n:2,r:.5};lg(`→${t.n}の攻撃力が50%上昇`)}break;
case'bug':{const p=t.s.pg;if(p)p.r=Math.max(p.r||.25,.5);else t.s.pg={n:2,r:.5};lg(`→${t.n}の防御力が50%上昇`)}break}}
function finish(){if(B.over==='win'){if(!B.done){B.done=1;const d=DF[G.diff],v=F(d.r*BOSS[B.bi].r/10);B.gain=v;
B.res=G.party.map(id=>{const c=G.ch[id],l0=c.lv;c.xp+=v;while(c.lv<30&&c.xp>=c.lv*50+50){c.xp-=c.lv*50+50;c.lv++}if(c.lv>=30)c.xp=0;return{n:CH.find(x=>x.id===id).n,l0,l1:c.lv,xp:c.xp}});G.gold+=v;G.clr[BOSS[B.bi].id+':'+G.diff]=1;save()}S.scr='win'}else S.scr='lose';draw()}
// ---- views ----
const stT=u=>[u.s.pois&&'毒',u.s.para&&'麻痺',(u.s.down||u.s.azd)&&'攻↓',u.s.pulse&&'脈動',(u.s.up||u.s.pa)&&'攻↑',(u.s.guard||u.s.pg)&&'軽減'].filter(Boolean).join(' ');
function draw(){const a=$('app');let h='';
if(S.scr==='title')h=`<h1>星辰ノ祭壇</h1><button class="ct" onclick="G=load();go('home')">開始</button>`;
else if(S.scr==='home'){h=`${S.err?`<div class="c err" onclick="S.err=0;draw()">${S.err}（タップで閉じる）</div>`:''}<h2>拠点</h2><div class="c">所持金 <b>${G.gold}</b> G</div>
<div class="c mu">編成：${G.party.map(id=>CH.find(c=>c.id===id).n+' Lv'+G.ch[id].lv).join(' / ')}</div>
<div class="mu">難易度</div><div class="r">${Object.keys(DF).map(d=>`<button class="ct ${G.diff===d?'on':''}" onclick="G.diff='${d}';save();draw()">${d}</button>`).join('')}</div>
<button onclick="go('party')">味方編成</button><button onclick="go('boss')">ボス選択</button><button onclick="go('shop')">ショップ</button><button onclick="go('set')">設定</button>`}
else if(S.scr==='party'){h=`<h2>味方編成（最大3人・選んだ順）</h2>`+CH.map(c=>{const l=G.ch[c.id].lv,x=cst(c,l),i=G.party.indexOf(c.id);return`<button class="${i>=0?'on':''}" onclick="tp('${c.id}')">${i>=0?'['+(i+1)+'] ':''}${c.n}　Lv${l}<br><span class="mu">職業 ${c.n} / HP ${x.hp} / 攻撃力 ${x.atk}</span></button><details class="c mu"><summary>役割・スキルを見る</summary><div style="margin-top:6px">${DS[c.id]}</div></details>`}).join('')+`<button class="ct" onclick="go('home')">戻る</button>`}
else if(S.scr==='boss'){h=`<h2>ボス選択（${G.diff}）</h2>`+BOSS.map((b,i)=>`<button onclick="S.bi=${i};go('bc')"><b>${b.n}</b>　<span class="mu">${G.diff}</span>${Object.keys(DF).filter(d=>G.clr[b.id+':'+d]).map(d=>` <span style="color:var(--ac)">✔${d}</span>`).join('')}<br><span class="mu">${b.d}</span></button>`).join('')+`<button class="ct" onclick="go('home')">戻る</button>`}
else if(S.scr==='bc'){const b=BOSS[S.bi];h=`<h2>${b.n}</h2><div class="mu">難易度：${G.diff}</div><div class="c" style="line-height:1.8">${BL[b.id]}</div><div class="c mu">出撃：${G.party.map(id=>CH.find(c=>c.id===id).n+' Lv'+G.ch[id].lv).join(' / ')}</div><div class="mu ct">この相手と戦いますか？</div><button class="ct on" onclick="startB(${S.bi});draw()">戦う</button><button class="ct" onclick="go('boss')">戻る</button>`}
else if(S.scr==='shop'){h=`<h2>ショップ　${G.gold}G</h2>`+IT.map(i=>{const n=G.items[i.id],ok=n<5&&G.gold>=i.p;return`<button ${ok?'':'disabled'} onclick="buy('${i.id}')"><b>${i.n}</b>　${i.p}G　所持 ${n}/5<br><span class="mu">${i.e}</span>${n>=5?' <span class="mu">(上限)</span>':''}</button>`}).join('')+`<button class="ct" onclick="go('home')">戻る</button>`}
else if(S.scr==='set')h=`<h2>設定</h2><button onclick="go('cf')">最初からやり直す</button><button class="ct" onclick="go('home')">戻る</button>`;
else if(S.scr==='cf')h=`<h2>本当にやり直しますか？</h2><p>所持金・レベル・アイテム等のセーブデータがすべて消えます。</p><button onclick="G=newG();save();S.err=0;go('home')">はい、やり直す</button><button class="ct" onclick="go('set')">いいえ</button>`;
else if(S.scr==='win')h=`<h2>勝利！</h2><div class="c">獲得 <b>${B.gain}</b> G ／ 各自 <b>${B.gain}</b> EXP</div>`+B.res.map(r=>`<div class="c">${r.n}　Lv${r.l0}${r.l1>r.l0?` → <b>Lv${r.l1}</b> レベルアップ！(HP+${10*(r.l1-r.l0)} 攻撃+${2*(r.l1-r.l0)})`:''}<br><span class="mu">次のLvまで経験値 ${r.l1>=30?'MAX':r.xp+' / '+(r.l1*50+50)}</span></div>`).join('')+`<button class="ct" onclick="B=null;go('home')">拠点へ戻る</button>`;
else if(S.scr==='lose')h=`<h2>敗北…</h2><p class="mu">報酬は得られなかった。</p><button class="ct" onclick="B=null;go('home')">拠点へ戻る</button>`;
else if(S.scr==='battle')h=rB();
a.innerHTML=h;requestAnimationFrame(()=>requestAnimationFrame(()=>a.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%')));const l=$('lg');if(l)l.scrollTop=l.scrollHeight}
function rB(){const mis=B.boss.b.id==='mis',bs=B.boss,p=B.p,tg_=B.ph==='tgt',es=tg_&&p.side==='e',as=tg_&&p.side!=='e';
let h=`<div class="bt bg${B.bg}">${B.intro?`<div class="ov">${bs.n}</div>`:''}<div class="ct"><b>${bs.n}</b><br>${bar(bs.hp,bs.mhp,'e','T')}<span class="mu">HP ${bs.hp} / ${bs.mhp}</span>${bs.b.id==='tin'&&B.chase&&!B.over?`<div style="color:#d8a0a0;margin-top:4px">追跡対象：<b>${B.chase.t.n}</b>（残り${Math.max(0,5-(B.round-B.chase.r0))}ターン）</div>`:''}</div>
<div class="${mis?'':'r'}" style="margin-top:6px${mis?';display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px':''}">${B.en.map((e,i)=>e&&!(e.hound&&e.dead)?`<div class="c ${e.dead?'dead':''} ${es&&!e.dead&&!e.inv?'sel':''}" onclick="tg('e',${i})">${e.n}${e.dead?' 【撃破】':''}${e.inv?' 【門の影】':''}${e.gate?` 残り${Math.max(0,13-(B.round-e.r0))}ターン`:''}<br>${bar(e.hp,e.mhp,'e','e'+i)}<span class="mu">${e.hp}/${e.mhp} ${stT(e)}</span></div>`:mis?'<div></div>':'').join('')}</div>
<div id="lg">${B.log.map(t=>`<div>${t}</div>`).join('')}</div>`;
h+=B.al.map((a,i)=>{const can=!a.dead&&!a.skip&&B.ph==='sel',as2=as&&((p.side==='d')===a.dead),cur=B.actor===a;
return`<div class="c ${a.dead?'dead':''} ${can||as2||cur?'sel':''}" onclick="${as?`tg('a',${i})`:`pickActor(${i})`}">${a.n}${a.dead?' 【戦闘不能】':a.skip?' 【行動不能】':''}${bs.b.id==='tin'&&B.chase&&B.chase.t===a&&!a.dead&&!B.over?' 【追跡】':''} <span class="mu">${stT(a)}</span><br>HP ${a.hp}/${a.mhp}${bar(a.hp,a.mhp,'h','ah'+i)}MP ${a.mp}/${a.mmp}${bar(a.mp,a.mmp,'m','am'+i)}</div>`}).join('')+'</div>';
if(B.over)h+=`<button class="ct" onclick="finish()">${B.over==='win'?'戦闘に勝利した… 結果へ':'全滅した… 結果へ'}</button>`;
else if(B.ph==='sel')h+=`<div class="ct mu">行動する味方をタップ</div>`;
else if(B.ph==='act')h+=`<div class="mu">${B.actor.n}の行動</div><div class="r"><button onclick="pAtk()">通常攻撃</button><button onclick="ph('sk')">スキル</button><button onclick="ph('it')">アイテム</button></div><button class="ct" onclick="B.actor=null;ph('sel')">戻る</button>`;
else if(B.ph==='sk')h+=B.actor.c.sk.map((k,i)=>`<button ${B.actor.mp<k.mp?'disabled':''} onclick="pSk(${i})">${k.n}　MP${k.mp}</button>`).join('')+`<button class="ct" onclick="ph('act')">戻る</button>`;
else if(B.ph==='it')h+=IT.map(i=>{const ok=G.items[i.id]>0&&(i.id!=='rev'||B.al.some(a=>a.dead));return`<button ${ok?'':'disabled'} onclick="pIt('${i.id}')">${i.n}　所持 ${G.items[i.id]}<br><span class="mu">${i.e}</span></button>`}).join('')+`<button class="ct" onclick="ph('act')">戻る</button>`;
else if(tg_)h+=`<div class="ct mu">対象をタップ</div><button class="ct" onclick="back()">キャンセル</button>`;
if(B.intro){B.intro=0}return h}
function tp(id){const i=G.party.indexOf(id);if(i>=0){if(G.party.length>1)G.party.splice(i,1)}else if(G.party.length<3)G.party.push(id);save();draw()}
function buy(id){const i=IT.find(x=>x.id===id);if(G.items[id]>=5||G.gold<i.p)return;G.gold-=i.p;G.items[id]++;save();draw()}
draw();
</script></body></html>
